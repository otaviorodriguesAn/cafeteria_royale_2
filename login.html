<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login — Cafeteria Royale</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<style>

body {

    margin: 0;

    background:
    linear-gradient(
        rgba(33,24,18,.75),
        rgba(33,24,18,.75)
    ),
    url("https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=90")
    center/cover fixed;

    font-family: Arial, sans-serif;

}

.navbar {

    background: #211812 !important;

}

.navbar-brand {

    font-weight: 800;
    color: white !important;

}

.navbar-brand span {

    color: #c99a5b;

}

.nav-link {

    color: white !important;

}

.login-box {

    max-width: 500px;

    margin: 90px auto;

    background: white;

    padding: 40px;

    border-radius: 20px;

    box-shadow:
    0 15px 45px rgba(0,0,0,.35);

}

.btn-royale {

    background: #c99a5b;

    color: #211812;

    border: none;

    font-weight: bold;

}

.btn-royale:hover {

    background: #e0b577;

}

.badge-royale {

    background: #c99a5b;

    color: #211812;

}

footer {

    background: #211812;

    color: white;

    padding: 40px 0;

}

</style>

</head>

<body>


<!-- HEADER -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a
class="navbar-brand"
href="index.html">

☕ Cafeteria <span>Royale</span>

</a>


<button
class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>


<div
class="collapse navbar-collapse"
id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a
class="nav-link"
href="index.html">

Home

</a>

</li>


<li class="nav-item">

<a
class="nav-link"
href="pedidos.html">

Pedidos

</a>

</li>


<li class="nav-item">

<a
class="nav-link"
href="produtos.html">

Produtos

</a>

</li>


<li class="nav-item">

<a
class="nav-link active"
href="login.html">

Login

</a>

</li>

</ul>

</div>

</div>

</nav>


<!-- LOGIN -->

<main class="container">

<div class="login-box">

<div class="text-center mb-4">

<span class="badge badge-royale">
ÁREA DO CLIENTE
</span>

<h1 class="mt-3">
Login
</h1>

<p>
Entre para acompanhar seus pedidos.
</p>

</div>


<form onsubmit="entrar(event)">


<div class="mb-3">

<label class="form-label">
Nome
</label>

<input
id="nome"
class="form-control"
placeholder="Digite seu nome"
required>

</div>


<div class="mb-3">

<label class="form-label">
E-mail
</label>

<input
id="email"
type="email"
class="form-control"
placeholder="Digite seu e-mail"
required>

</div>


<div class="mb-3">

<label class="form-label">
Senha
</label>

<input
id="senha"
type="password"
class="form-control"
placeholder="Digite sua senha"
required>

</div>


<button
class="btn btn-royale w-100 btn-lg">

<i class="bi bi-box-arrow-in-right"></i>

Entrar

</button>


</form>

</div>

</main>


<!-- FOOTER -->

<footer>

<div class="container text-center">

<h4>
Cafeteria Royale
</h4>

<p>
Um espaço moderno para transformar
cada café em uma experiência especial.
</p>

<small>
© 2026 Cafeteria Royale
</small>

</div>

</footer>


<script>

function entrar(event) {

    event.preventDefault();

    const nome =
        document.getElementById("nome").value;

    localStorage.setItem(
        "royaleUsuario",
        nome
    );

    window.location.href =
        "pedidos.html";

}

</script>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
